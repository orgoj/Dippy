[package]
name = "dippy-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of Dippy approval decisions"

[[bin]]
name = "dippy-rs"
path = "src/main.rs"

[dependencies]
rable = "=0.2.1"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
rustpython-ruff_python_parser = "=0.16.10"
rustpython-ruff_python_ast = "=0.16.10"
rustpython-ruff_text_size = "=0.16.10"
