[package]
name = "dippy-rs"
version = "0.4.30"
edition = "2024"
license = "MIT"
description = "Rust port of Dippy approval decisions"

[[bin]]
name = "dippy-rs"
path = "src/main.rs"

[dependencies]
rable = "=0.2.1"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rustpython-ruff_python_parser = "=0.16.10"
rustpython-ruff_python_ast = "=0.16.10"
rustpython-ruff_text_size = "=0.16.10"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.4"
