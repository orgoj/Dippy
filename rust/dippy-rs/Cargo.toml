[package]
name = "dippy-rs"
version = "0.5.3"
edition = "2024"
license = "MIT"
description = "Rust port of Dippy approval decisions"

[[bin]]
name = "dippy-rs"
path = "src/main.rs"

[dependencies]
rable = "=0.2.1"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rustpython-ruff_python_parser = "=0.16.10"
rustpython-ruff_python_ast = "=0.16.10"
rustpython-ruff_text_size = "=0.16.10"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.4"
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
raw-window-handle = "0.6"
sha2 = "0.10"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
sqlparser = { version = "=0.63.0", features = ["visitor"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"
